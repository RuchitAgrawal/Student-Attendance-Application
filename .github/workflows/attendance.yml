name: Attendance Summary

on:
  push:
    branches:
      - main
      - "feature/*"

jobs:
  run-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance summary script
        run: python attendance.py

      - name: Run pytest
        run: pytest test_attendance.py -v
